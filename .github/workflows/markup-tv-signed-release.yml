name: MarkUpTV Signed Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Release version name
        required: true
        default: "1.1"
      version_code:
        description: Android version code
        required: true
        default: "7"
permissions:
  contents: write
jobs:
  signed-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Restore
        run: dotnet restore MarkUptv/MarkUptv.csproj
      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/markuptv-release.p12"
          test -s "$RUNNER_TEMP/markuptv-release.p12"
      - name: Publish unsigned APK with MSBuild Android packaging
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          dotnet publish MarkUptv/MarkUptv.csproj             -c Release -f net10.0-android             -p:AndroidPackageFormat=apk             -p:AndroidKeyStore=false             -p:ApplicationDisplayVersion=${{ inputs.version_name }}             -p:ApplicationVersion=${{ inputs.version_code }}             -warnaserror
      - name: Locate final APK
        run: |
          APK=$(find MarkUptv/bin/Release/net10.0-android -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" "$RUNNER_TEMP/MarkUpTV-release.apk"
          test -s "$RUNNER_TEMP/MarkUpTV-release.apk"
      - name: Verify resources.arsc packaging
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import zipfile
          apk = os.path.join(os.environ["RUNNER_TEMP"], "MarkUpTV-release.apk")
          with zipfile.ZipFile(apk) as z:
              info = z.getinfo("resources.arsc")
              print("resources.arsc compression:", info.compress_type)
              if info.compress_type != zipfile.ZIP_STORED:
                  raise SystemExit("ERROR: resources.arsc is compressed")
          PY
      - name: Align APK for 16 KB page-size compatibility
        shell: bash
        run: |
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -p -f -P 16 4 "$RUNNER_TEMP/MarkUpTV-release.apk" "$RUNNER_TEMP/MarkUpTV-aligned.apk"
          mv "$RUNNER_TEMP/MarkUpTV-aligned.apk" "$RUNNER_TEMP/MarkUpTV-release.apk"
          "$ZIPALIGN" -c -v -P 16 4 "$RUNNER_TEMP/MarkUpTV-release.apk"
      - name: Sign aligned APK
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEY_ALIAS" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/markuptv-release.p12" \
            --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$RUNNER_TEMP/MarkUpTV-signed.apk" \
            "$RUNNER_TEMP/MarkUpTV-release.apk"
          mv "$RUNNER_TEMP/MarkUpTV-signed.apk" "$RUNNER_TEMP/MarkUpTV-release.apk"

      - name: Verify APK signature
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$RUNNER_TEMP/MarkUpTV-release.apk"
      - name: Verify APK contents
        run: unzip -t "$RUNNER_TEMP/MarkUpTV-release.apk"
      - name: Publish signed APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}-${{ inputs.version_code }}
          name: MarkUpTV ${{ inputs.version_name }} build ${{ inputs.version_code }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: false
          body: |
            Signed MarkUpTV Android APK built with .NET 10 MAUI MSBuild packaging.
            Verified for ZIP integrity, resources.arsc storage, zip alignment and APK signature.
          files: ${{ runner.temp }}/MarkUpTV-release.apk
      - name: Upload signed APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkUpTV-signed-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: ${{ runner.temp }}/MarkUpTV-release.apk
          if-no-files-found: error
          retention-days: 14
