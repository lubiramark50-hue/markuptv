name: MarkUpTV Signed Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Release version name
        required: true
        default: "1.1"
      version_code:
        description: Android version code
        required: true
        default: "3"

permissions:
  contents: read

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore MAUI workload
        run: dotnet workload restore MarkUptv/MarkUptv.csproj
      - name: Restore
        run: dotnet restore MarkUptv/MarkUptv.csproj -p:TargetFramework=net10.0-android
      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/markuptv-release.keystore"
          test -s "$RUNNER_TEMP/markuptv-release.keystore"
      - name: Publish unsigned release APK
        run: >-
          dotnet publish MarkUptv/MarkUptv.csproj
          -c Release -f net10.0-android --no-restore
          -p:AndroidPackageFormat=apk -p:AndroidKeyStore=false
          -p:ApplicationDisplayVersion=${{ inputs.version_name }}
          -p:ApplicationVersion=${{ inputs.version_code }}
          -warnaserror
      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK=$(find MarkUptv/bin/Release/net10.0-android -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
      - name: Zipalign
        shell: bash
        run: |
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -p -f 4 "${{ steps.apk.outputs.path }}" "$RUNNER_TEMP/MarkUpTV-aligned.apk"
      - name: Sign APK with release key
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEY_ALIAS" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/markuptv-release.keystore" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$STORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" --out "$RUNNER_TEMP/MarkUpTV-release.apk" "$RUNNER_TEMP/MarkUpTV-aligned.apk"
          "$APKSIGNER" verify --verbose "$RUNNER_TEMP/MarkUpTV-release.apk"
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MarkUpTV-signed-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: ${{ runner.temp }}/MarkUpTV-release.apk
          if-no-files-found: error
          retention-days: 14
