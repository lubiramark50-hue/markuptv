name: Check release APK contents

on:
  push:
    branches: ['ui/check-abi']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect ota-5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ota-5 --repo "${{ github.repository }}" --pattern 'MarkUptv.apk' --dir .
          ls -l MarkUptv.apk
          sha256sum MarkUptv.apk
          unzip -tq MarkUptv.apk | tail -1
          unzip -l MarkUptv.apk | grep -oE "lib/[a-z0-9_-]+/" | sort | uniq -c
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)
          "$AAPT" dump badging MarkUptv.apk | grep -E "^package|sdkVersion|native-code|leanback" || true
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          echo "--- apksigner (min sdk 26)"
          "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 26 MarkUptv.apk 2>&1 | head -12
          echo "--- apksigner (default)"
          "$APKSIGNER" verify --verbose MarkUptv.apk 2>&1 | head -6
          echo "--- also check the arm32 test build and the universal test build"
          for T in apk-compat-148:MarkUpTV-arm32.apk apk-universal-156:MarkUpTV-universal.apk; do
            TAG=${T%%:*}; F=${T##*:}
            gh release download "$TAG" --repo "${{ github.repository }}" --pattern "$F" --dir . || continue
            echo "== $F"; ls -l "$F"
            "$APKSIGNER" verify --verbose --min-sdk-version 26 "$F" 2>&1 | head -6
          done
