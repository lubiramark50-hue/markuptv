name: UI screenshots (emulator)

on:
  push:
    branches: ['ui/**']
    paths:
      - '.ui-shots-trigger'
  workflow_dispatch:

concurrency:
  group: ui-shots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build debug APK (x86_64 for the emulator)
        run: |
          dotnet build MarkUptv/MarkUptv.csproj -c Debug -f net10.0-android \
            -p:RuntimeIdentifier=android-x64 -p:RuntimeIdentifiers=android-x64 \
            -p:EmbedAssembliesIntoApk=true \
            -p:AndroidPackageFormat=apk
          APK=$(find MarkUptv/bin/Debug -type f -name '*Signed.apk' | head -n 1)
          [ -n "$APK" ] || APK=$(find MarkUptv/bin/Debug -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          unzip -Z1 "$APK" | grep -q '^lib/x86_64/' || {
            echo "Debug screenshot APK missing x86_64 native libraries" >&2
            exit 1
          }
          echo "APK_PATH=$GITHUB_WORKSPACE/$APK" >> "$GITHUB_ENV"
          ls -l "$APK"
          rm -rf MarkUptv/obj
          sudo rm -rf /usr/local/share/boost /opt/ghc /usr/share/swift || true
          sudo rm -rf /usr/share/dotnet "$HOME/.dotnet" "$HOME/.nuget" /opt/hostedtoolcache /usr/local/.ghcup /opt/az /usr/share/miniconda /opt/microsoft /usr/local/share/powershell || true
          df -h / | tail -1
          df -h / | tail -1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          disk-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/ui-shots.sh shots

      - name: Create phone and TV page contact sheets
        if: always()
        run: |
          python3 -m pip install -q Pillow
          python3 tools/ui_contact_sheet.py shots

      - name: Upload UI screenshot audit and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: markuptv-ui-pages-${{ github.run_number }}
          path: shots/
          if-no-files-found: warn
          retention-days: 14
